<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>剧本模拟器</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-deep: #040508;
  --bg-main: #080A0F;
  --bg-panel: #0B0E15;
  --bg-card: #10141E;
  --bg-input: #141926;
  --border: #1C2333;
  --border-light: #262F44;
  --gold: #D4A33B;
  --gold-light: #F2C96D;
  --gold-dim: #7A5C22;
  --red: #C92A1F;
  --red-light: #E84A3C;
  --red-dim: #4A120D;
  --text-primary: #EAE4D6;
  --text-secondary: #8B9EBA;
  --text-dim: #425475;
  --green: #358C4A;
  --green-light: #57C776;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--bg-deep);
  color: var(--text-primary);
  font-family: 'Noto Sans SC', sans-serif;
  overflow: hidden;
}

.screen { display: none; width: 100%; height: 100%; }
.screen.active { display: flex; }

/* ============================================================
INTRO SCREEN (SCENARIO SELECTION)
============================================================ */
#intro-screen {
  flex-direction: column;
  background: radial-gradient(ellipse at 50% 35%, #120D05 0%, #040508 75%);
  position: relative;
  overflow-y: auto;
}

#intro-screen::-webkit-scrollbar { width: 4px; }
#intro-screen::-webkit-scrollbar-thumb { background: var(--border-light); }

.scanlines {
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent, transparent 2px,
    rgba(0,0,0,0.12) 2px, rgba(0,0,0,0.12) 4px
  );
  pointer-events: none;
  z-index: 1;
}

.intro-header {
  position: relative;
  z-index: 2;
  text-align: center;
  padding: 60px 20px 40px;
}

.intro-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 36px;
  font-weight: 700;
  letter-spacing: 10px;
  color: #FFFFFF;
  margin-bottom: 10px;
  text-shadow: 0 0 40px rgba(212,163,59,0.3);
}

.intro-en { font-size: 10px; color: var(--text-secondary); letter-spacing: 4px; }

.scenario-list {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  gap: 24px;
  max-width: 700px;
  margin: 0 auto;
  padding: 0 40px 60px;
  width: 100%;
}

.scenario-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  padding: 24px 30px;
  width: 85%;
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}

.scenario-card::before {
  content: '';
  position: absolute;
  top: 0; bottom: 0;
  width: 3px;
  background: var(--gold-dim);
  transition: background 0.3s;
}

.scenario-card:nth-child(odd) { align-self: flex-start; text-align: left; }
.scenario-card:nth-child(odd)::before { left: 0; }
.scenario-card:nth-child(even) { align-self: flex-end; text-align: right; }
.scenario-card:nth-child(even)::before { right: 0; }

.scenario-card:hover {
  border-color: var(--gold-dim);
  background: rgba(212,163,59,0.05);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.2);
}
.scenario-card:hover::before { background: var(--gold); }

.sc-title { font-family: 'Noto Serif SC', serif; font-size: 20px; color: var(--gold); margin-bottom: 8px; letter-spacing: 2px; }
.sc-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.6; }

.btn-enter {
  background: transparent;
  border: 1px solid var(--gold);
  color: var(--gold);
  padding: 13px 48px;
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 12px;
  letter-spacing: 4px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: color 0.25s;
  margin: 0 auto 60px;
  display: block;
  z-index: 2;
}
.btn-enter::after {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--gold);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.25s ease;
  z-index: 0;
}
.btn-enter span { position: relative; z-index: 1; }
.btn-enter:hover { color: var(--bg-deep); }
.btn-enter:hover::after { transform: scaleX(1); }

/* ============================================================
CREATION SCREEN
============================================================ */
#creation-screen {
  flex-direction: column;
  overflow-y: auto;
  background: var(--bg-main);
}
#creation-screen::-webkit-scrollbar { width: 4px; }
#creation-screen::-webkit-scrollbar-thumb { background: var(--border-light); }

.creation-header {
  background: var(--bg-panel);
  border-bottom: 1px solid var(--border);
  padding: 18px 48px;
  display: flex;
  align-items: center;
  gap: 14px;
  flex-shrink: 0;
  position: sticky;
  top: 0;
  z-index: 10;
}

.header-pip { width: 7px; height: 7px; background: var(--gold); border-radius: 50%; flex-shrink: 0; }
.creation-header h2 { font-family: 'Noto Serif SC', serif; font-size: 14px; color: var(--gold); letter-spacing: 2px; font-weight: 500; }

.creation-body { padding: 40px 48px; max-width: 860px; margin: 0 auto; width: 100%; }

.section-label {
  font-size: 9px; color: var(--gold-dim); letter-spacing: 4px; text-transform: uppercase;
  padding-bottom: 12px; border-bottom: 1px solid var(--border); margin-bottom: 24px;
  display: flex; justify-content: space-between; align-items: center;
}

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 36px; }
.field { display: flex; flex-direction: column; gap: 8px; }
.field.wide { grid-column: 1 / -1; }
.field label { font-size: 10px; color: var(--text-secondary); letter-spacing: 2px; }
.field label .req { color: var(--red-light); margin-left: 3px; }

.field input, .field select, .field textarea {
  background: var(--bg-input); border: 1px solid var(--border); color: var(--text-primary);
  padding: 10px 14px; font-family: 'Noto Sans SC', sans-serif; font-size: 13px; outline: none;
  transition: border-color 0.2s; width: 100%; -webkit-appearance: none;
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--gold); box-shadow: 0 0 8px rgba(212,163,59,0.15); }
.field select { cursor: pointer; }
.field select option { background: var(--bg-card); }
.field textarea { resize: vertical; min-height: 76px; line-height: 1.7; }

.identity-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-bottom: 36px; }
.id-card {
  border: 1px solid var(--border); background: var(--bg-card); padding: 18px 10px 14px;
  text-align: center; cursor: pointer; transition: all 0.2s;
}
.id-card:hover { border-color: var(--gold-dim); background: rgba(212,163,59,0.05); transform: translateY(-2px); }
.id-card.selected { border-color: var(--gold); background: rgba(212,163,59,0.09); box-shadow: 0 0 15px rgba(212,163,59,0.15); }
.id-card.selected .id-icon { color: var(--gold); }
.id-icon { font-size: 24px; display: block; margin-bottom: 10px; color: var(--text-dim); transition: color 0.2s; }
.id-title { font-size: 12px; color: var(--text-primary); letter-spacing: 1px; margin-bottom: 6px; }
.id-desc { font-size: 10px; color: var(--text-dim); line-height: 1.6; }

.creation-footer { display: flex; justify-content: center; gap: 20px; padding: 16px 0 48px; }

/* ============================================================
GAME SCREEN
============================================================ */
#game-screen { flex-direction: column; overflow: hidden; }
.game-topbar { background: var(--bg-panel); border-bottom: 1px solid var(--border); padding: 11px 24px; display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
.topbar-logo { font-family: 'Noto Serif SC', serif; font-size: 12px; color: var(--gold); letter-spacing: 3px; font-weight: 500; }
.topbar-sep { width: 1px; height: 14px; background: var(--border-light); }
.topbar-location { font-size: 11px; color: var(--text-secondary); letter-spacing: 1px; }
.topbar-location::before { content: '◉\00a0'; color: var(--red-light); font-size: 8px; }
.topbar-chapter { font-size: 10px; color: var(--text-dim); letter-spacing: 2px; border: 1px solid var(--border); padding: 3px 10px; }

.error-bar { background: var(--red-dim); border-bottom: 1px solid var(--red); color: var(--text-secondary); padding: 9px 24px; font-size: 11px; letter-spacing: 1px; display: none; }
.error-bar.show { display: block; }

.game-main { flex: 1; display: grid; grid-template-columns: 1fr 288px; overflow: hidden; }
.narrative-wrap { display: flex; flex-direction: column; border-right: 1px solid var(--border); overflow: hidden; }
.narrative-scroll { flex: 1; overflow-y: auto; padding: 36px 40px 24px; scroll-behavior: smooth; }
.narrative-scroll::-webkit-scrollbar { width: 3px; }
.narrative-scroll::-webkit-scrollbar-thumb { background: var(--border-light); }
#narrative-text { font-family: 'Noto Serif SC', serif; font-size: 14.5px; line-height: 2.1; color: var(--text-primary); white-space: pre-wrap; }
#narrative-text .seg-divider { display: block; border: none; border-top: 1px solid var(--border); margin: 28px 0; }

.choices-wrap { flex-shrink: 0; border-top: 1px solid var(--border); background: var(--bg-panel); padding: 16px 20px; max-height: 260px; overflow-y: auto; }
.choices-wrap::-webkit-scrollbar { width: 3px; }
.choices-wrap::-webkit-scrollbar-thumb { background: var(--border); }
.choices-header { font-size: 9px; color: var(--text-dim); letter-spacing: 3px; margin-bottom: 12px; }
.choices-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
.choice-btn { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-primary); padding: 10px 12px; font-family: 'Noto Sans SC', sans-serif; font-size: 12px; line-height: 1.55; text-align: left; cursor: pointer; transition: border-color 0.15s, background 0.15s, color 0.15s; display: flex; gap: 9px; align-items: flex-start; }
.choice-btn:hover:not(:disabled) { border-color: var(--gold-dim); background: rgba(196,146,42,0.07); color: var(--gold-light); }
.choice-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.choice-btn.custom-btn { grid-column: 1 / -1; border-style: dashed; border-color: var(--text-dim); color: var(--text-secondary); }
.choice-num { font-family: monospace; font-size: 10px; color: var(--gold-dim); flex-shrink: 0; margin-top: 2px; }
.custom-row { display: none; gap: 8px; grid-column: 1 / -1; padding-top: 4px; }
.custom-row.show { display: flex; }
.custom-row input { flex: 1; background: var(--bg-input); border: 1px solid var(--gold-dim); color: var(--text-primary); padding: 8px 12px; font-family: 'Noto Serif SC', serif; font-size: 13px; outline: none; }
.custom-row button { background: var(--gold-dim); border: none; color: var(--text-primary); padding: 8px 18px; font-size: 12px; cursor: pointer; transition: background 0.2s; letter-spacing: 1px; font-family: 'Noto Sans SC', sans-serif; }
.custom-row button:hover { background: var(--gold); color: var(--bg-deep); }

.stats-wrap { display: flex; flex-direction: column; gap: 20px; padding: 20px 16px; overflow-y: auto; }
.stats-wrap::-webkit-scrollbar { width: 3px; }
.stats-wrap::-webkit-scrollbar-thumb { background: var(--border); }
.stat-block-title { font-size: 9px; color: var(--text-dim); letter-spacing: 3px; margin-bottom: 12px; }
.char-plate { background: var(--bg-card); border: 1px solid var(--border); padding: 14px; }
.char-plate-name { font-family: 'Noto Serif SC', serif; font-size: 17px; color: var(--text-primary); margin-bottom: 2px; }
.char-plate-nick { font-size: 11px; color: var(--gold-dim); letter-spacing: 1px; margin-bottom: 12px; min-height: 16px; }
.char-plate-row { display: flex; gap: 8px; font-size: 10px; margin-bottom: 5px; }
.cpr-label { color: var(--text-dim); min-width: 32px; }
.cpr-value { color: var(--text-secondary); }
.rel-row { margin-bottom: 13px; }
.rel-meta { display: flex; justify-content: space-between; margin-bottom: 5px; }
.rel-name { font-size: 11px; color: var(--text-secondary); }
.rel-nums { font-size: 9px; color: var(--text-dim); font-family: monospace; }
.bar-track { height: 3px; background: var(--border); margin-bottom: 3px; overflow: hidden; }
.bar-fill { height: 100%; transition: width 0.6s ease; min-width: 0; }
.bar-fill.like { background: var(--gold); }
.bar-fill.love { background: var(--red-light); }

/* Loading */
#loading-overlay { display: none; position: fixed; inset: 0; background: rgba(7,9,14,0.75); z-index: 200; align-items: center; justify-content: center; flex-direction: column; gap: 14px; backdrop-filter: blur(2px); }
#loading-overlay.show { display: flex; }
.load-dots { display: flex; gap: 7px; }
.ld { width: 7px; height: 7px; background: var(--gold); border-radius: 50%; animation: ldpulse 1.2s ease-in-out infinite; }
.ld:nth-child(2) { animation-delay: 0.2s; }
.ld:nth-child(3) { animation-delay: 0.4s; }
@keyframes ldpulse { 0%, 100% { opacity: 0.15; transform: scale(0.7); } 50% { opacity: 1; transform: scale(1); } }

/* ============================================================
BUTTONS & MODALS
============================================================ */
.settings-btn { position: absolute; top: 20px; right: 24px; z-index: 10; background: transparent; border: 1px solid var(--border-light); color: var(--text-secondary); width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: border-color 0.2s, color 0.2s; font-size: 15px; }
.settings-btn:hover { border-color: var(--gold-dim); color: var(--gold); }
.topbar-settings { margin-left: 8px; background: transparent; border: 1px solid var(--border); color: var(--text-dim); width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 13px; transition: border-color 0.2s, color 0.2s; flex-shrink: 0; }
.topbar-settings:hover { border-color: var(--gold-dim); color: var(--gold); }

.modal { display: none; position: fixed; inset: 0; background: rgba(7,9,14,0.82); z-index: 300; align-items: center; justify-content: center; backdrop-filter: blur(3px); }
.modal.show { display: flex; }
.settings-box { background: var(--bg-panel); border: 1px solid var(--border-light); width: 100%; max-width: 560px; margin: 16px; display: flex; flex-direction: column; max-height: 90vh; }
.settings-header { display: flex; align-items: center; gap: 12px; padding: 16px 22px; border-bottom: 1px solid var(--border); }
.settings-header-pip { width: 6px; height: 6px; background: var(--gold); border-radius: 50%; }
.settings-header h3 { font-family: 'Noto Serif SC', serif; font-size: 13px; color: var(--gold); letter-spacing: 3px; font-weight: 500; }
.settings-close { margin-left: auto; background: transparent; border: none; color: var(--text-dim); font-size: 18px; cursor: pointer; line-height: 1; transition: color 0.15s; padding: 2px 4px; }
.settings-close:hover { color: var(--text-primary); }
.settings-body { padding: 24px 22px; display: flex; flex-direction: column; gap: 18px; overflow-y: auto; }
.settings-body::-webkit-scrollbar { width: 3px; }
.settings-body::-webkit-scrollbar-thumb { background: var(--border-light); }
.settings-field { display: flex; flex-direction: column; gap: 7px; }
.settings-label { font-size: 10px; color: var(--text-secondary); letter-spacing: 2px; display: flex; align-items: center; gap: 8px; }
.settings-hint { font-size: 9px; color: var(--text-dim); letter-spacing: 0; font-weight: 400; }
.settings-input, .settings-textarea { background: var(--bg-input); border: 1px solid var(--border); color: var(--text-primary); padding: 10px 13px; font-family: 'Noto Sans SC', sans-serif; font-size: 12px; outline: none; transition: border-color 0.2s; width: 100%; }
.settings-input:focus, .settings-textarea:focus { border-color: var(--gold-dim); }
.settings-textarea { resize: vertical; min-height: 100px; line-height: 1.7; font-family: 'Noto Serif SC', serif; font-size: 12px; }
.settings-divider { height: 1px; background: var(--border); margin: 4px 0; }
.settings-footer { padding: 14px 22px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }

.btn-save { background: var(--gold-dim); border: none; color: var(--text-primary); padding: 9px 28px; font-family: 'Noto Sans SC', sans-serif; font-size: 12px; letter-spacing: 2px; cursor: pointer; transition: background 0.2s; }
.btn-save:hover { background: var(--gold); color: var(--bg-deep); }
.btn-cancel { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); padding: 9px 20px; font-family: 'Noto Sans SC', sans-serif; font-size: 12px; letter-spacing: 1px; cursor: pointer; transition: border-color 0.2s, color 0.2s; }
.btn-cancel:hover { border-color: var(--text-secondary); color: var(--text-primary); }
.save-confirm { margin-left: auto; font-size: 11px; color: var(--green-light); letter-spacing: 1px; opacity: 0; transition: opacity 0.3s; }
.save-confirm.show { opacity: 1; }

.list-item { background: var(--bg-card); border: 1px solid var(--border); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: border-color 0.2s; }
.list-item:hover { border-color: var(--gold-dim); }
.list-item-title { font-size: 13px; color: var(--text-primary); margin-bottom: 4px; }
.list-item-sub { font-size: 10px; color: var(--text-dim); }
.list-item-actions { display: flex; gap: 8px; }

@media (max-width: 820px) {
  .game-main { grid-template-columns: 1fr; }
  .stats-wrap { display: none; }
  .form-grid { grid-template-columns: 1fr; }
  .choices-grid { grid-template-columns: 1fr; }
  .creation-body { padding: 28px 24px; }
  .scenario-card { width: 100%; text-align: left !important; }
  .scenario-card::before { left: 0 !important; right: auto !important; }
}
</style>
</head>
<body>

<!-- INTRO SCREEN (SCENARIOS) -->
<div id="intro-screen" class="screen active">
  <div class="scanlines"></div>
  <button class="settings-btn" title="API 配置" onclick="openModal('settings-modal')">
    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
  </button>
  
  <div class="intro-header">
    <div class="intro-title">交互式档案系统</div>
    <div class="intro-en">INTERACTIVE NARRATIVE ARCHIVE SYSTEM</div>
  </div>
  
  <div class="scenario-list" id="scenario-list">
    <!-- Rendered via JS -->
  </div>
  
  <button class="btn-enter" onclick="openModal('scenario-modal')">
    <span>+ 添加自定义剧本</span>
  </button>
</div>

<!-- CREATION SCREEN -->
<div id="creation-screen" class="screen">
  <div class="creation-header">
    <div class="header-pip"></div>
    <h2>人员档案建立 - <span id="creation-scenario-title"></span></h2>
    <div style="margin-left: auto; display: flex; gap: 10px;">
      <button class="btn-cancel" style="padding: 4px 12px;" onclick="openModal('persona-modal')">人设库</button>
      <button class="btn-cancel" style="padding: 4px 12px; border-color: transparent;" onclick="backToScenarios()">返回</button>
    </div>
  </div>

  <div class="creation-body">
    <div class="section-label">
      <span>— 基础信息 · BASIC INFORMATION —</span>
    </div>
    <div class="form-grid">
      <div class="field"><label>姓名 <span class="req">*</span></label><input id="f-name" placeholder="角色姓名" /></div>
      <div class="field"><label>亲密昵称</label><input id="f-nick" placeholder="亲近之人的称呼（可留空）" /></div>
      <div class="field"><label>年龄 <span class="req">*</span></label><input id="f-age" type="number" placeholder="15 – 40" /></div>
      <div class="field"><label>出生日期</label><input id="f-birthday" placeholder="例：3月22日" /></div>
      <div class="field wide"><label>性格特征 <span class="req">*</span></label><input id="f-personality" placeholder="例：外冷内热、执着倔强、敏感细腻、冷静理智……" /></div>
      <div class="field wide"><label>外貌描述</label><textarea id="f-appearance" placeholder="身高体型、发色眼神、标志性特征……"></textarea></div>
      <div class="field wide"><label>背景故事</label><textarea id="f-background" placeholder="家庭环境、过去经历、进入这个故事的缘由……"></textarea></div>
    </div>

    <div class="section-label"><span>— 选择身份 · SELECT IDENTITY —</span></div>
    <div class="identity-row" id="identity-container"></div>

    <div class="section-label"><span>— 进入时期 · STARTING PERIOD —</span></div>
    <div class="form-grid">
      <div class="field wide">
        <label>故事起点 <span class="req">*</span></label>
        <select id="f-period"><option value="">请选择进入时期……</option></select>
      </div>
    </div>

    <div class="creation-footer">

<script>
// ============================================================
// DATA & STATE
// ============================================================
const DEFAULT_SCENARIO = {
  id: 's_default',
  title: '铁拳教育',
  desc: '能说通就说，说不通，就打。',
  intro: `【世界观】\n韩国当代，2010年禁止体罚法导致教育体制崩坏：教师无法管教学生，校园霸凌横行，问题学生在未成年人保护法庇护下为所欲为。为此，政府成立教权保护局（ERPA，교육권리보호국），赋予督察合法物理惩戒权，以非常手段解决非常问题。\n\n【核心人物性格（绝对不允许OOC）】\n• 罗华振 — 王牌督察，外冷内热，行事果决，简洁强硬。未婚妻被学生杀害，此后对恶行零容忍。台词极简有力：「继续」「跟上」「这是他应得的」。\n• 崔康锡 — 教育部部长，ERPA创始人，深谋远虑，政治老手。\n• 任含琳 — 干练漂亮，开朗直爽，勇敢无畏。\n• 赵圭哲 — 核心反派，表面悔改、内心阴毒。`,
  identities: [
    { name: '学生', desc: '在崩坏的体制中挣扎求存的普通人', icon: '🏫' },
    { name: '霸凌者', desc: '利用制度漏洞横行校园的问题学生', icon: '👊' },
    { name: '被霸凌者', desc: '在黑暗中挣扎，等待曙光降临', icon: '🌧️' },
    { name: '教师', desc: '在困境中坚守理想的教育工作者', icon: '📋' },
    { name: '教权保护局督察', desc: '以铁拳守护教育正义的ERPA成员', icon: '⚡' }
  ],
  periods: [
    '第一幕前·大韩高中案发酵前夕',
    '第一幕·罗华振进驻大韩高中',
    '第二幕·宋芮梨诬陷郑老师案',
    '第三幕·校园舞弊与赌博案并发',
    '第四幕·赵圭哲假释回归辰原高中',
    '第五幕·贩毒案与最终决战'
  ]
};

let appData = { scenarios: [DEFAULT_SCENARIO], personas: [], saves: [] };
let currentScenario = null;
let char = {};
let chosenId = '';
let history = []; 
let stats = { loc: '未知', chap: '—', rels: {} };

function loadAppData() {
  const data = localStorage.getItem('erpa_app_data_v2');
  if (data) {
    try { appData = JSON.parse(data); } catch(e) { console.error(e); }
  }
  // Ensure default scenario exists
  if (!appData.scenarios.find(s => s.id === 's_default')) {
    appData.scenarios.unshift(DEFAULT_SCENARIO);
  }
  renderScenarios();
}

function saveAppData() {
  localStorage.setItem('erpa_app_data_v2', JSON.stringify(appData));
}

// ============================================================
// MODALS & SETTINGS
// ============================================================
function openModal(id) {
  document.querySelectorAll('.modal').forEach(m => m.classList.remove('show'));
  document.getElementById(id).classList.add('show');
  
  if (id === 'settings-modal') {
    document.getElementById('cfg-format').value = localStorage.getItem('erpa_format') || 'anthropic';
    document.getElementById('cfg-url').value  = localStorage.getItem('erpa_url') || '';
    document.getElementById('cfg-key').value  = localStorage.getItem('erpa_key') || '';
    document.getElementById('cfg-model').value = localStorage.getItem('erpa_model') || '';
    document.getElementById('cfg-prompt').value = localStorage.getItem('erpa_prompt') || '';
    updatePlaceholders();
  } else if (id === 'persona-modal') {
    renderPersonas();
  } else if (id === 'save-modal') {
    document.getElementById('new-save-name').value = '';
    renderSaves('save-list', true);
  } else if (id === 'load-modal') {
    renderSaves('load-list', false);
  }
}

function closeModal(id) {
  document.getElementById(id).classList.remove('show');
}

document.querySelectorAll('.modal').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) closeModal(m.id); });
});

function saveSettings() {
  localStorage.setItem('erpa_format', document.getElementById('cfg-format').value);
  localStorage.setItem('erpa_url', document.getElementById('cfg-url').value.trim());
  localStorage.setItem('erpa_key', document.getElementById('cfg-key').value.trim());
  localStorage.setItem('erpa_model', document.getElementById('cfg-model').value.trim());
  localStorage.setItem('erpa_prompt', document.getElementById('cfg-prompt').value.trim());
  
  const c = document.getElementById('save-confirm');
  c.classList.add('show');
  setTimeout(() => c.classList.remove('show'), 2000);
}

function updatePlaceholders() {
  const fmt = document.getElementById('cfg-format').value;
  document.getElementById('cfg-url').placeholder = fmt === 'openai' ? 'https://api.openai.com/v1/chat/completions' : 'https://api.anthropic.com/v1/messages';
  document.getElementById('cfg-model').placeholder = fmt === 'openai' ? 'gpt-4o' : 'claude-3-5-sonnet-20240620';
}

// ============================================================
// SCENARIOS
// ============================================================
function renderScenarios() {
  const list = document.getElementById('scenario-list');
  list.innerHTML = '';
  appData.scenarios.forEach(sc => {
    const card = document.createElement('div');
    card.className = 'scenario-card';
    card.innerHTML = `
      <div class="sc-title">${sc.title}</div>
      <div class="sc-desc">${sc.desc}</div>
      ${sc.id !== 's_default' ? `<button onclick="event.stopPropagation(); deleteScenario('${sc.id}')" style="position:absolute; top:10px; right:10px; background:transparent; border:none; color:var(--red); cursor:pointer;">✕</button>` : ''}
    `;
    card.onclick = () => selectScenario(sc);
    list.appendChild(card);
  });
}

function saveNewScenario() {
  const title = document.getElementById('sc-title').value.trim();
  const desc = document.getElementById('sc-desc').value.trim();
  const intro = document.getElementById('sc-intro').value.trim();
  const idsRaw = document.getElementById('sc-ids').value.trim();
  const periodsRaw = document.getElementById('sc-periods').value.trim();

  if (!title || !desc || !intro || !idsRaw || !periodsRaw) return alert('请填写完整所有带 * 的字段。');

  const identities = idsRaw.split(/[,，]/).map(s => s.trim()).filter(s => s).map(name => ({ name, desc: '', icon: '👤' }));
  const periods = periodsRaw.split(/[,，]/).map(s => s.trim()).filter(s => s);

  appData.scenarios.push({
    id: 's_' + Date.now(),
    title, desc, intro, identities, periods
  });
  saveAppData();
  renderScenarios();
  closeModal('scenario-modal');
  
  document.getElementById('sc-title').value = '';
  document.getElementById('sc-desc').value = '';
  document.getElementById('sc-intro').value = '';
  document.getElementById('sc-ids').value = '';
  document.getElementById('sc-periods').value = '';
}

function deleteScenario(id) {
  if (confirm('确定删除这个自定义剧本吗？')) {
    appData.scenarios = appData.scenarios.filter(s => s.id !== id);
    saveAppData();
    renderScenarios();
  }
}

function selectScenario(sc) {
  currentScenario = sc;
  document.getElementById('intro-screen').classList.remove('active');
  document.getElementById('creation-screen').classList.add('active');
  
  document.getElementById('creation-scenario-title').textContent = sc.title;
  
  // Render Identities
  const idCont = document.getElementById('identity-container');
  idCont.innerHTML = '';
  sc.identities.forEach(id => {
    const card = document.createElement('div');
    card.className = 'id-card';
    card.innerHTML = `<span class="id-icon">${id.icon}</span><div class="id-title">${id.name}</div><div class="id-desc">${id.desc}</div>`;
    card.onclick = () => {
      document.querySelectorAll('.id-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      chosenId = id.name;
    };
    idCont.appendChild(card);
  });
  chosenId = '';

  // Render Periods
  const pSel = document.getElementById('f-period');
  pSel.innerHTML = '<option value="">请选择进入时期……</option>';
  sc.periods.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p; opt.textContent = p;
    pSel.appendChild(opt);
  });
  
  // Clear form
  document.querySelectorAll('#creation-screen input, #creation-screen textarea').forEach(el => el.value = '');
}

function backToScenarios() {
  document.getElementById('creation-screen').classList.remove('active');
  document.getElementById('intro-screen').classList.add('active');
}

// ============================================================
// PERSONAS
// ============================================================
function saveCurrentToPersona() {
  const name = document.getElementById('f-name').value.trim();
  if (!name) return alert('至少填写姓名才能保存人设。');
  
  const persona = {
    id: 'p_' + Date.now(),
    name,
    nick: document.getElementById('f-nick').value.trim(),
    age: document.getElementById('f-age').value.trim(),
    birthday: document.getElementById('f-birthday').value.trim(),
    personality: document.getElementById('f-personality').value.trim(),
    appearance: document.getElementById('f-appearance').value.trim(),
    background: document.getElementById('f-background').value.trim()
  };
  
  appData.personas.push(persona);
  saveAppData();
  renderPersonas();
}

function renderPersonas() {
  const list = document.getElementById('persona-list');
  list.innerHTML = '';
  if (appData.personas.length === 0) {
    list.innerHTML = '<div style="color:var(--text-dim); font-size:12px; text-align:center;">暂无人设</div>';
    return;
  }
  
  appData.personas.forEach(p => {
    const item = document.createElement('div');
    item.className = 'list-item';
    item.innerHTML = `
      <div>
        <div class="list-item-title">${p.name} <span style="color:var(--gold-dim);font-size:10px;">(${p.age}岁)</span></div>
        <div class="list-item-sub">${p.personality || '无性格描述'}</div>
      </div>
      <div class="list-item-actions">
        <button class="btn-save" style="padding:4px 10px;" onclick="applyPersona('${p.id}')">使用</button>
        <button class="btn-cancel" style="padding:4px 10px;" onclick="deletePersona('${p.id}')">删除</button>
      </div>
    `;
    list.appendChild(item);
  });
}

function applyPersona(id) {
  const p = appData.personas.find(x => x.id === id);
  if (p) {
    document.getElementById('f-name').value = p.name || '';
    document.getElementById('f-nick').value = p.nick || '';
    document.getElementById('f-age').value = p.age || '';
    document.getElementById('f-birthday').value = p.birthday || '';
    document.getElementById('f-personality').value = p.personality || '';
    document.getElementById('f-appearance').value = p.appearance || '';
    document.getElementById('f-background').value = p.background || '';
    closeModal('persona-modal');
  }
}

function deletePersona(id) {
  if (confirm('确定删除该人设吗？')) {
    appData.personas = appData.personas.filter(x => x.id !== id);
    saveAppData();
    renderPersonas();
  }
}

// ============================================================
// SAVE / LOAD
// ============================================================
function createNewSave() {
  if (!char.name) return alert('当前没有进行中的游戏。');
  const name = document.getElementById('new-save-name').value.trim() || `${currentScenario.title} - ${char.name} - ${new Date().toLocaleString()}`;
  
  const saveData = {
    id: 'save_' + Date.now(),
    name,
    timestamp: Date.now(),
    scenarioId: currentScenario.id,
    char, history, stats,
    narrativeHtml: document.getElementById('narrative-text').innerHTML,
    choicesHtml: document.getElementById('choices-grid').innerHTML
  };
  
  appData.saves.push(saveData);
  saveAppData();
  renderSaves('save-list', true);
  document.getElementById('new-save-name').value = '';
}

function renderSaves(containerId, isSaveMode) {
  const list = document.getElementById(containerId);
  list.innerHTML = '';
  
  const sorted = [...appData.saves].sort((a,b) => b.timestamp - a.timestamp);
  
  if (sorted.length === 0) {
    list.innerHTML = '<div style="color:var(--text-dim); font-size:12px; text-align:center;">暂无存档</div>';
    return;
  }
  
  sorted.forEach(s => {
    const sc = appData.scenarios.find(x => x.id === s.scenarioId);
    const scTitle = sc ? sc.title : '未知剧本';
    
    const item = document.createElement('div');
    item.className = 'list-item';
    item.innerHTML = `
      <div>
        <div class="list-item-title">${s.name}</div>
        <div class="list-item-sub">${scTitle} | ${s.char.name} | ${new Date(s.timestamp).toLocaleString()}</div>
      </div>
      <div class="list-item-actions">
        ${isSaveMode ? 
          `<button class="btn-cancel" style="padding:4px 10px;" onclick="overwriteSave('${s.id}')">覆盖</button>` : 
          `<button class="btn-save" style="padding:4px 10px;" onclick="loadSave('${s.id}')">读取</button>`
        }
        <button class="btn-cancel" style="padding:4px 10px;" onclick="deleteSave('${s.id}', '${containerId}', ${isSaveMode})">删除</button>
      </div>
    `;
    list.appendChild(item);
  });
}

function overwriteSave(id) {
  if (!char.name) return alert('当前没有进行中的游戏。');
  if (confirm('确定覆盖此存档吗？')) {
    const idx = appData.saves.findIndex(x => x.id === id);
    if (idx > -1) {
      appData.saves[idx] = {
        ...appData.saves[idx],
        timestamp: Date.now(),
        scenarioId: currentScenario.id,
        char, history, stats,
        narrativeHtml: document.getElementById('narrative-text').innerHTML,
        choicesHtml: document.getElementById('choices-grid').innerHTML
      };
      saveAppData();
      renderSaves('save-list', true);
    }
  }
}

function deleteSave(id, containerId, isSaveMode) {
  if (confirm('确定删除此存档吗？')) {
    appData.saves = appData.saves.filter(x => x.id !== id);
    saveAppData();
    renderSaves(containerId, isSaveMode);
  }
}

function loadSave(id) {
  const s = appData.saves.find(x => x.id === id);
  if (!s) return alert('存档不存在。');
  
  currentScenario = appData.scenarios.find(x => x.id === s.scenarioId) || DEFAULT_SCENARIO;
  char = s.char;
  history = s.history;
  stats = s.stats;
  
  document.getElementById('intro-screen').classList.remove('active');
  document.getElementById('creation-screen').classList.remove('active');
  document.getElementById('game-screen').classList.add('active');
  
  document.getElementById('topbar-sc-title').textContent = currentScenario.title;
  document.getElementById('sp-name').textContent = char.name;
  document.getElementById('sp-nick').textContent = char.nick ? `「${char.nick}」` : '';
  document.getElementById('sp-identity').textContent = char.identity;
  
  updateLoc(stats.loc);
  updateChap(stats.chap);
  renderRels();
  
  document.getElementById('narrative-text').innerHTML = s.narrativeHtml || '';
  document.getElementById('choices-grid').innerHTML = s.choicesHtml || '';
  
  // Re-bind events
  const customBtn = document.querySelector('.custom-btn');
  if (customBtn) customBtn.onclick = revealCustom;
  
  document.querySelectorAll('.choice-btn:not(.custom-btn)').forEach(btn => {
    const textSpan = btn.querySelector('span:nth-child(2)');
    if (textSpan) btn.onclick = () => choose(textSpan.textContent);
  });

  const customInput = document.getElementById('custom-input');
  if (customInput) {
    customInput.addEventListener('keydown', e => { if (e.key === 'Enter') submitCustom(); });
  }
  
  closeModal('load-modal');
}

// ============================================================
// GAME ENGINE
// ============================================================
function beginGame() {
  const name = document.getElementById('f-name').value.trim();
  const age  = document.getElementById('f-age').value.trim();
  const pers = document.getElementById('f-personality').value.trim();
  const period = document.getElementById('f-period').value;

  if (!name || !age || !pers || !chosenId || !period) return alert('请完整填写带有 * 的必填项并选择身份和时期。');

  char = {
    name, age, pers, period, identity: chosenId,
    nick: document.getElementById('f-nick').value.trim() || name,
    birthday: document.getElementById('f-birthday').value.trim(),
    appearance: document.getElementById('f-appearance').value.trim(),
    background: document.getElementById('f-background').value.trim(),
  };

  stats = { loc: '未知', chap: '—', rels: {} };

  document.getElementById('topbar-sc-title').textContent = currentScenario.title;
  document.getElementById('sp-name').textContent = char.name;
  document.getElementById('sp-nick').textContent = char.nick ? `「${char.nick}」` : '';
  document.getElementById('sp-identity').textContent = char.identity;
  
  document.getElementById('narrative-text').innerHTML = '';
  document.getElementById('choices-grid').innerHTML = '';
  renderRels();

  document.getElementById('creation-screen').classList.remove('active');
  document.getElementById('game-screen').classList.add('active');

  kickoff();
}

function getSystemPrompt() {
  const base = `你是文字冒险游戏的叙事引擎。

${currentScenario.intro}

【好感度/爱意值系统】
0-100整数。单次变动≤5点，禁止突飞猛进。
- 好感度：从冷漠→认可→信任→生死相托
- 爱意值：仅在好感≥60后才开始增长，代表超越友情的情感

【输出格式（严格遵守，每轮必须完整输出三个块）】
[NARRATIVE]
500字以上沉浸式叙事，从玩家视角，文风如剧集观感——简洁有力，动作描写干脆利落，心理描写捕捉微表情而非直白说教。
[/NARRATIVE]

[STATUS]
位置：（当前具体地点）
阶段：（当前剧情幕次与事件名）
变动：（如"某某好感度+2"，无变动则写"无"）
[/STATUS]

[CHOICES]
1. （第一个行动选项）
2. （第二个行动选项）
3. （第三个行动选项）
4. （第四个行动选项）
5. 【自拟行动】
[/CHOICES]

【强制规则】
- 每轮只推进一步，等待玩家选择，禁止预支剧情
- 选项必须高度契合玩家当前处境和性格
- 所有因果必须符合世界逻辑，禁止机械降神
- 剧情连贯，上一轮发生的事下一轮必须记住
- 称呼玩家时用"你"，不用"玩家"`;

  const extra = localStorage.getItem('erpa_prompt')?.trim() || '';
  return extra ? base + '\n\n【用户附加设定】\n' + extra : base;
}

async function kickoff() {
  const init = `请开始游戏。

玩家档案：
姓名：${char.name}
昵称：${char.nick}
年龄：${char.age}岁
性格：${char.pers}
身份：${char.identity}
出生：${char.birthday || '未提供'}
外貌：${char.appearance || '未描述'}
背景：${char.background || '无'}
进入时期：${char.period}

请按格式输出开场叙事和第一组选项。`;

  history = [];
  await call(init);
}

async function choose(text) {
  disableAll();
  await call(text);
}

async function call(msg) {
  setLoading(true);
  setError(false);
  history.push({ role: 'user', content: msg });

  const format  = localStorage.getItem('erpa_format') || 'anthropic';
  const apiUrl  = localStorage.getItem('erpa_url')?.trim() || (format === 'openai' ? 'https://api.openai.com/v1/chat/completions' : 'https://api.anthropic.com/v1/messages');
  const apiKey  = localStorage.getItem('erpa_key')?.trim() || '';
  const modelId = localStorage.getItem('erpa_model')?.trim() || (format === 'openai' ? 'gpt-4o' : 'claude-3-5-sonnet-20240620');
  const sysPrompt = getSystemPrompt();

  if (!apiKey) {
    setLoading(false);
    alert('请先点击右上角设置图标填写 API Key。');
    return;
  }

  let lastUserMsg = msg;
  try {
    let reqHeaders = { 'Content-Type': 'application/json' };
    let reqBody = {};

    if (format === 'openai') {
      reqHeaders['Authorization'] = `Bearer ${apiKey}`;
      reqBody = {
        model: modelId,
        max_tokens: 4096,
        messages: [{ role: 'system', content: sysPrompt }, ...history]
      };
    } else {
      reqHeaders['x-api-key'] = apiKey;
      reqHeaders['anthropic-version'] = '2023-06-01';
      reqHeaders['anthropic-dangerous-direct-browser-access'] = 'true';
      reqBody = {
        model: modelId,
        max_tokens: 4096,
        system: sysPrompt,
        messages: history
      };
    }

    let fetchUrl = apiUrl.replace(/\/+$/, '');
    if (format === 'openai' && !fetchUrl.endsWith('/chat/completions')) fetchUrl += '/chat/completions';
    else if (format === 'anthropic' && !fetchUrl.endsWith('/messages')) fetchUrl += '/messages';

    const res = await fetch(fetchUrl, { method: 'POST', headers: reqHeaders, body: JSON.stringify(reqBody) });
    const data = await res.json();
    if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));

    let raw = format === 'openai' ? (data.choices?.[0]?.message?.content || '') : ((data.content || []).map(b => b.text || '').join(''));
    
    history.push({ role: 'assistant', content: raw });
    parse(raw);
  } catch(e) {
    console.error(e);
    history.pop();
    setError(true);
    window._lastFailedMsg = lastUserMsg;
  } finally {
    setLoading(false);
  }
}

function retryLastCall() {
  if (window._lastFailedMsg) call(window._lastFailedMsg);
}

function parse(raw) {
  raw = raw.replace(/<think>[\s\S]*?<\/think>/g, '').trim();
  const nm = raw.match(/\[NARRATIVE\]([\s\S]*?)(?:\[\/NARRATIVE\]|\[STATUS\]|\[CHOICES\]|$)/i);
  const narrative = nm ? nm[1].trim() : raw.replace(/\[STATUS\][\s\S]*?(?:\[\/STATUS\]|$)/ig, '').replace(/\[CHOICES\][\s\S]*?(?:\[\/CHOICES\]|$)/ig, '').trim();

  const sm = raw.match(/\[STATUS\]([\s\S]*?)(?:\[\/STATUS\]|\[CHOICES\]|$)/i);
  if (sm) {
    const st = sm[1];
    const lm = st.match(/位置[：:]\s*(.+)/);
    const cm = st.match(/阶段[：:]\s*(.+)/);
    const dm = st.match(/变动[：:]\s*(.+)/);
    if (lm) updateLoc(lm[1].trim());
    if (cm) updateChap(cm[1].trim());
    if (dm && dm[1].trim() !== '无') applyDeltas(dm[1]);
  }

  const chm = raw.match(/\[CHOICES\]([\s\S]*?)(?:\[\/CHOICES\]|$)/i);
  let choices = [];
  if (chm) {
    chm[1].split('\n').forEach(ln => {
      let text = ln.replace(/^(\d+[\.、:：]\s*|[-*]\s*)/, '').trim();
      if (text) choices.push(text);
    });
  }
  if (choices.length === 0) choices = ['继续...', '【自拟行动】'];

  appendNarrative(narrative);
  renderChoices(choices);
  renderRels();
}

function applyDeltas(text) {
  const re = /([^\s,，、+\-\d]+)(好感度|爱意值)([+\-]\d+)/g;
  let m;
  while ((m = re.exec(text)) !== null) {
    const name = m[1], type = m[2] === '好感度' ? 'like' : 'love', delta = parseInt(m[3]);
    if (!stats.rels[name]) stats.rels[name] = { like: 0, love: 0 };
    stats.rels[name][type] = Math.max(0, Math.min(100, (stats.rels[name][type] || 0) + delta));
  }
}

function updateLoc(loc) { stats.loc = loc; document.getElementById('topbar-loc').textContent = loc; document.getElementById('sp-loc').textContent = loc; }
function updateChap(chap) { stats.chap = chap; document.getElementById('topbar-chap').textContent = chap; document.getElementById('sp-chap').textContent = chap; }

// ============================================================
// RENDERING
// ============================================================
function appendNarrative(text) {
  const el = document.getElementById('narrative-text');
  if (el.children.length > 0) {
    const hr = document.createElement('span'); hr.className = 'seg-divider'; el.appendChild(hr);
  }
  const span = document.createElement('span'); span.textContent = text; el.appendChild(span);
  const scroll = document.getElementById('narrative-scroll');
  requestAnimationFrame(() => { scroll.scrollTop = scroll.scrollHeight; });
}

function renderChoices(choices) {
  const grid = document.getElementById('choices-grid');
  grid.innerHTML = '';
  choices.forEach((c, i) => {
    const btn = document.createElement('button');
    const custom = /自拟/.test(c);
    btn.className = 'choice-btn' + (custom ? ' custom-btn' : '');
    if (custom) {
      btn.innerHTML = `<span class="choice-num">✎</span><span>自拟行动……</span>`;
      btn.onclick = revealCustom;
    } else {
      btn.innerHTML = `<span class="choice-num">${String(i+1).padStart(2,'0')}</span><span>${c}</span>`;
      btn.onclick = () => choose(c);
    }
    grid.appendChild(btn);
  });
  const cr = document.createElement('div');
  cr.className = 'custom-row'; cr.id = 'custom-row';
  cr.innerHTML = `<input id="custom-input" placeholder="输入你的行动……"><button onclick="submitCustom()">确认</button>`;
  grid.appendChild(cr);
  document.getElementById('custom-input').addEventListener('keydown', e => { if (e.key === 'Enter') submitCustom(); });
}

function revealCustom() {
  const cr = document.getElementById('custom-row');
  if (cr) { cr.classList.add('show'); document.getElementById('custom-input').focus(); }
}

function submitCustom() {
  const inp = document.getElementById('custom-input');
  const val = inp.value.trim();
  if (!val) return;
  inp.value = '';
  document.getElementById('custom-row')?.classList.remove('show');
  choose(val);
}

function renderRels() {
  const cont = document.getElementById('rels-container');
  cont.innerHTML = '';
  Object.entries(stats.rels).forEach(([name, v]) => {
    const div = document.createElement('div'); div.className = 'rel-row';
    div.innerHTML = `
      <div class="rel-meta"><span class="rel-name">${name}</span><span class="rel-nums">好感 ${v.like} · 爱意 ${v.love}</span></div>
      <div class="bar-track"><div class="bar-fill like" style="width:${v.like}%"></div></div>
      <div class="bar-track"><div class="bar-fill love" style="width:${v.love}%"></div></div>
    `;
    cont.appendChild(div);
  });
}

function disableAll() { document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true); }
function setLoading(v) { document.getElementById('loading-overlay').classList.toggle('show', v); }
function setError(v) { document.getElementById('error-bar').classList.toggle('show', v); }

// Init
loadAppData();
</script>
